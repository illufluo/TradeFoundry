[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "tradefoundry"
version = "0.1.0"
description = "仅用于 OKX BTC/ETH 永续研究的离线量化实验室"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["plotly>=6,<7", "pyarrow>=19,<24"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
tradefoundry = "tradefoundry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tradefoundry"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
